server:
  port: ${SERVER_PORT:8090}
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/ntd}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driverClassName: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate.ddl-auto: ${JPA_DDL_AUTO:update}
    defer-datasource-initialization: true
    open-in-view: false
  h2:
    console.enabled: ${H2_CONSOLE_ENABLED:false}
jwt:
  secret:
    key: ${JWT_SECRET:local-development-secret-change-before-deployment}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}
